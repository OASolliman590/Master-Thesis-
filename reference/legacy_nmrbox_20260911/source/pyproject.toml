[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ici-thesis-pipeline"
version = "0.1.0"
description = "Spec-first thesis pipeline scaffold for ICI discovery and PRAD epigenetic validation."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

