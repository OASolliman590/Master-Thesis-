name: Export A-DAV Spec Kit

on:
  push:
    branches:
      - review/a-data-acquisition-validation-speckit-20261012
    paths:
      - '.github/workflows/export-a-dav-speckit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/a-data-acquisition-validation-speckit-20261012

      - name: Assemble download package
        shell: bash
        run: |
          set -euo pipefail
          package='Paper_A_A1_Data_Acquisition_Validation_SpecKit_20261015'
          mkdir -p "$package/specs" "$package/docs/execution" "$package/docs/validation" "$package/tests/a_data_acquisition_validation"
          cp -a specs/A_DATA_ACQUISITION_VALIDATION "$package/specs/"
          cp docs/execution/A_DAV_SPEC_KIT_HANDOFF.md "$package/docs/execution/"
          cp -a docs/validation/A_DAV_SPEC_KIT_20261015 "$package/docs/validation/"
          cp tests/a_data_acquisition_validation/test_spec_kit.py "$package/tests/a_data_acquisition_validation/"
          cat > "$package/DOWNLOAD_README.md" <<'EOF'
          # Paper A + A.1 Data Acquisition and Validation Spec Kit

          Review branch: `review/a-data-acquisition-validation-speckit-20261012`

          Specification package: `specs/A_DATA_ACQUISITION_VALIDATION/`

          Start with:

          1. `specs/A_DATA_ACQUISITION_VALIDATION/README.md`
          2. `specs/A_DATA_ACQUISITION_VALIDATION/A_DATA_ACQUISITION_VALIDATION_APPRAISAL.md`
          3. `docs/execution/A_DAV_SPEC_KIT_HANDOFF.md`
          4. `docs/validation/A_DAV_SPEC_KIT_20261015/REVIEW.md`

          This is a reviewed specification package. It does not contain patient-level records, populated registries, biological results or a released Paper A/A.1 dataset.
          EOF
          find "$package" -type f -print0 | sort -z | xargs -0 sha256sum > "$package/SHA256SUMS.txt"

      - name: Upload downloadable Spec Kit
        uses: actions/upload-artifact@v4
        with:
          name: Paper_A_A1_Data_Acquisition_Validation_SpecKit_20261015
          path: Paper_A_A1_Data_Acquisition_Validation_SpecKit_20261015
          if-no-files-found: error
          retention-days: 90
