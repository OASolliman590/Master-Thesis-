name: Apply A-DAV Spec Kit

on:
  push:
    branches:
      - review/a-data-acquisition-validation-speckit-20261012
    paths:
      - '.bootstrap/a-dav-spec-kit/**'
      - '.github/workflows/apply-a-dav-speckit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: review/a-data-acquisition-validation-speckit-20261012

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/a-dav-spec-kit/part00 \
            .bootstrap/a-dav-spec-kit/part01 \
            .bootstrap/a-dav-spec-kit/part02 \
            .bootstrap/a-dav-spec-kit/part03 \
            .bootstrap/a-dav-spec-kit/part04 \
            .bootstrap/a-dav-spec-kit/part05 \
            .bootstrap/a-dav-spec-kit/part06 \
            .bootstrap/a-dav-spec-kit/part07 \
            .bootstrap/a-dav-spec-kit/part08 \
            .bootstrap/a-dav-spec-kit/part09 \
            .bootstrap/a-dav-spec-kit/part10 \
            .bootstrap/a-dav-spec-kit/part110 \
            .bootstrap/a-dav-spec-kit/part111 \
            .bootstrap/a-dav-spec-kit/part112 \
            .bootstrap/a-dav-spec-kit/part113 \
            .bootstrap/a-dav-spec-kit/part12 \
            .bootstrap/a-dav-spec-kit/part13 \
            .bootstrap/a-dav-spec-kit/part14 \
            > /tmp/a-dav-payload.b64
          printf '%s  %s\n' \
            '5b159bb2e35e3c291fe495796a43e599574db64f7486350c6927c870811314d7' \
            '/tmp/a-dav-payload.b64' | sha256sum --check --strict

      - name: Decode and verify archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/a-dav-payload.b64 > /tmp/a-dav-payload.tar.gz
          printf '%s  %s\n' \
            '9923b016700c4169977fa31457e3feed7f20a0b6c03f90cb8afea11840bef340' \
            '/tmp/a-dav-payload.tar.gz' | sha256sum --check --strict

      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf /tmp/a-dav-payload.tar.gz > /tmp/a-dav-archive-files.txt
          test -s /tmp/a-dav-archive-files.txt

      - name: Expand reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/a-dav-payload.tar.gz -C .
          rm -rf .bootstrap/a-dav-spec-kit
          rm -f .github/workflows/apply-a-dav-speckit.yml

      - name: Validate specification kit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema
          python -W error::ResourceWarning -m unittest tests.a_data_acquisition_validation.test_spec_kit -v

      - name: Commit validated package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone Paper A and A.1 acquisition validation spec kit [skip ci]"
          git push origin HEAD:review/a-data-acquisition-validation-speckit-20261012
